spring:
  application:
    name: moneylog

  datasource:
    # 로컬은 H2로 돌린다. 배포(MySQL) 설정은 application-prod.yaml에 따로 있다.
    url: jdbc:h2:file:./data/moneylogdb;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 운영에서는 JWT_SECRET 환경변수로 넣는다. 아래 값은 로컬에서만 쓰는 기본값.
  secret: ${JWT_SECRET:local-dev-only-secret-key-1234567890-abcdefghij}
  expiration-ms: 3600000
