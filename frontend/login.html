<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>머니로그 - 로그인</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <h1>머니로그</h1>

    <div id="login-box">
      <h2>로그인</h2>
      <label>이메일</label>
      <input type="email" id="login-email" placeholder="hong@moneylog.com" />
      <label>비밀번호</label>
      <input type="password" id="login-password" placeholder="비밀번호" />
      <button onclick="login()">로그인</button>
      <div class="error-message" id="login-error"></div>
      <div class="switch-link">
        계정이 없으신가요? <a onclick="showSignup()">회원가입</a>
      </div>
    </div>

    <div id="signup-box" style="display:none;">
      <h2>회원가입</h2>
      <label>이메일</label>
      <input type="email" id="signup-email" placeholder="hong@moneylog.com" />
      <label>비밀번호</label>
      <input type="password" id="signup-password" placeholder="4자 이상" />
      <label>닉네임</label>
      <input type="text" id="signup-nickname" placeholder="홍길동" />
      <button onclick="signup()">회원가입</button>
      <div class="error-message" id="signup-error"></div>
      <div class="switch-link">
        이미 계정이 있으신가요? <a onclick="showLogin()">로그인</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
